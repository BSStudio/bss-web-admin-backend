# Squawk lints the Flyway migrations: https://squawkhq.com/docs/
pg_version = "18.0"
# Flyway runs each migration in a transaction
assume_in_transaction = true
# The migrations run when the app starts, where waiting for a lock is better than failing to start
excluded_rules = ["require-lock-timeout", "require-statement-timeout"]
# Written before Squawk was added: fixing its warnings would change the schema they create, not only their layout
excluded_paths = [
  "../server/data/src/main/resources/db/migration/V0__*.pgsql",
  "../server/data/src/main/resources/db/migration/V1__*.pgsql",
  "../server/data/src/main/resources/db/migration/V2__*.pgsql",
  "../server/data/src/main/resources/db/migration/V3__*.pgsql",
  "../server/data/src/main/resources/db/migration/V4__*.pgsql",
  "../server/data/src/main/resources/db/migration/V5__*.pgsql",
  "../server/data/src/main/resources/db/migration/V6__*.pgsql",
  "../server/data/src/main/resources/db/migration/V7__*.pgsql",
  "../server/data/src/main/resources/db/migration/V8__*.pgsql",
]
