name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  schedule:
    # weekly re-scan, so newly released queries run against unchanged code too
    - cron: "23 4 * * 1"
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-26.04
    name: "Analyze (${{ matrix.language }})"
    timeout-minutes: 30
    permissions:
      contents: read # to check out the code
      security-events: write # to upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            # Kotlin is only extracted from a real compilation, build-mode none would skip it
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        if: ${{ matrix.build-mode == 'manual' }}
        with:
          distribution: "liberica"
          java-version: 25
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        if: ${{ matrix.build-mode == 'manual' }}
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      # compile production code only; the build cache and the Gradle daemon would hide kotlinc from the CodeQL tracer
      - if: ${{ matrix.build-mode == 'manual' }}
        run: "./gradlew classes --no-build-cache --no-daemon"
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
