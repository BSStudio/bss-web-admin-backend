name: CodeQL

on:
  workflow_dispatch:
  pull_request:
  merge_group:
  schedule:
    # weekly re-scan, so newly released queries run against unchanged code too
    - cron: "23 4 * * 1"
  push:
    branches: [ "main" ]

permissions: read-all

jobs:
  analyze:
    runs-on: ubuntu-26.04
    name: "Analyze (${{ matrix.language }})"
    timeout-minutes: 30
    permissions:
      security-events: write # to upload the results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: java-kotlin
            # Kotlin is only extracted from a real compilation, build-mode none would skip it
            build-mode: manual
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: ${{ matrix.build-mode == 'manual' }}
        with:
          distribution: "liberica"
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: ${{ matrix.build-mode == 'manual' }}
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
      # compile production code only; the build cache and the Gradle daemon would hide kotlinc from the CodeQL tracer
      - if: ${{ matrix.build-mode == 'manual' }}
        run: "./gradlew classes --no-build-cache --no-daemon"
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:${{ matrix.language }}"
