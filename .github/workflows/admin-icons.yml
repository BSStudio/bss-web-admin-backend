name: Admin icons

on:
  pull_request:
  workflow_dispatch:
  merge_group:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04-arm
    name: "Verify generated icons"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          lfs: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Check generated files are current
        run: |
          bash tools/admin-icons/generate-icons.sh
          if [[ -n "$(git status --porcelain --untracked-files=all -- server/ui/src/main/resources/static/admin/icons)" ]]; then
            git status --short --untracked-files=all -- server/ui/src/main/resources/static/admin/icons
            echo "::error::Admin icon generation changed the checked-in icon set. Regenerate icons and commit the results."
            exit 1
          fi
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: "liberica"
          java-version: 25
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
      - name: Verify icon formats and references
        run: ./gradlew :server:ui:test --tests hu.bsstudio.bssweb.ui.AdminIconsTest
