services:
  app:
    build:
      context: "./"
    ports:
      - "127.0.0.1:8080:8080"
    # healthcheck: defined by the image's HEALTHCHECK (the distroless image has no wget)
    profiles:
      - app
    depends_on:
      - postgres
      - mock-login
    environment:
      bss.file-api.url: "http://mock-file-api:8080"
      bss.file-api.username: "username"
      bss.file-api.password: "password"
      spring.security.oauth2.resourceserver.opaquetoken.introspection-uri: "http://mock-oidc:8080/o/introspect"
      spring.security.oauth2.resourceserver.opaquetoken.client-id: client-id
      spring.security.oauth2.resourceserver.opaquetoken.client-secret: client-secret
      spring.datasource.url: "jdbc:postgresql://postgres:5432/bss?currentSchema=private"
      spring.datasource.username: "user"
      spring.datasource.password: "password"
      spring.flyway.default-schema: "private"
      spring.flyway.schemas: "private,public"
      management.endpoints.web.exposure.include: "prometheus,health"
      # admin UI login: the browser talks to localhost, the app talks to the container
      spring.security.oauth2.client.registration.authentik.client-id: "admin-ui"
      spring.security.oauth2.client.registration.authentik.client-secret: "secret"
      spring.security.oauth2.client.registration.authentik.authorization-grant-type: "authorization_code"
      spring.security.oauth2.client.registration.authentik.redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      spring.security.oauth2.client.registration.authentik.scope: "openid,profile,email"
      spring.security.oauth2.client.provider.authentik.authorization-uri: "http://localhost:8999/default/authorize"
      spring.security.oauth2.client.provider.authentik.token-uri: "http://mock-login:8080/default/token"
      spring.security.oauth2.client.provider.authentik.jwk-set-uri: "http://mock-login:8080/default/jwks"
      spring.security.oauth2.client.provider.authentik.user-info-uri: "http://mock-login:8080/default/userinfo"
      spring.security.oauth2.client.provider.authentik.user-name-attribute: "sub"

  postgres:
    # update server/data/src/test/resources/application.yml
    image: "postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873"
    environment:
      POSTGRES_DB: "bss"
      POSTGRES_USER: "user"
      POSTGRES_PASSWORD: "password"
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: "pg_isready -q -U postgres"
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
  mock-file-api:
    image: "wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3"
    ports:
      - "127.0.0.1:8888:8080"
    healthcheck:
      test: "curl -fs http://localhost:8080/__admin/docs > /dev/null || exit 1"
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - "./docker/wiremock/stubs/file-api:/home/wiremock/mappings/file-api"
  mock-oidc:
    image: "wiremock/wiremock:3.13.2@sha256:0d4ecb3e4dc8213fd7a4d37d6a78f6e6b553a6d2e15bd51b0999781282ac61b3"
    ports:
      - "127.0.0.1:8998:8080"
    healthcheck:
      test: "curl -fs http://localhost:8080/__admin/docs > /dev/null || exit 1"
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
    volumes:
      - "./docker/wiremock/stubs/oidc:/home/wiremock/mappings/oidc"

  mock-login:
    # OIDC provider with a login form for the admin UI; type any username to log in
    image: "ghcr.io/navikt/mock-oauth2-server:6.0.4@sha256:47374fe063995d9b6d39ebb6ea21eb5f765025bf0aa08b61b08b439eb91adaf0"
    ports:
      - "127.0.0.1:8999:8080"
    environment:
      JSON_CONFIG: '{"interactiveLogin": true}'

  prometheus:
    image: "prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - "./docker/prometheus.yml:/etc/prometheus/prometheus.yml"
    profiles:
      - metrics
    healthcheck:
      test: wget --tries=1 --no-verbose -qO- http://localhost:9090/-/ready | grep -q "Prometheus Server is Ready."
      start_period: 5s
      interval: 30s
      timeout: 5s
      retries: 3
  grafana:
    image: "grafana/grafana:13.2.4-ubuntu@sha256:d838696907b4350d9232eb8da1503dc1d1010a0359d3ce4b3f7d2ff7db28eb75"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - "./docker/grafana:/var/lib/grafana"
    profiles:
      - metrics
    depends_on:
      - prometheus
    healthcheck:
      test: curl -fs http://localhost:3000/api/health | grep -q "\"ok\""
