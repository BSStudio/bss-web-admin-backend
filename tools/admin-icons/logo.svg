<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title">
  <title id="title">BSS</title>
  <!--
    The attributes draw the dark tile, which is what the PNG icons are rendered from and what a viewer without CSS
    shows. A browser in the light scheme (its tab strip, for the favicon) gets the light tile from the style below.
    Colours are admin.css's: the tile is the page background, the letters are the ink.
  -->
  <style>
    @media (prefers-color-scheme: light) {
      .tile { fill: #ffffff; }
      .letters { fill: #151619; }
    }
  </style>
  <defs>
    <!-- admin.css blends the frame in OKLCH; SVG gradients blend only in sRGB, so these stops sample that blend. -->
    <linearGradient id="frame" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0" stop-color="#f29050" />
      <stop offset="0.1667" stop-color="#f6796b" />
      <stop offset="0.3333" stop-color="#ee678f" />
      <stop offset="0.5" stop-color="#d95db6" />
      <stop offset="0.6667" stop-color="#b85bdb" />
      <stop offset="0.8333" stop-color="#895ff5" />
      <stop offset="1" stop-color="#4168fe" />
    </linearGradient>
  </defs>
  <rect x="1.5" y="1.5" width="45" height="45" rx="6.5" class="tile" fill="#151619" stroke="url(#frame)" stroke-width="3" />
  <!-- BSS is outlined from Roboto Bold so the mark renders identically on every device. -->
