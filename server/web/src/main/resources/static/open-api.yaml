  /api/v1/event/deleted:
    get:
      operationId: getDeletedEvents
      summary: Read the deleted events (paginated)
      description: Read the deleted events (paginated). A deleted event is left out
        of every other endpoint until it is restored.
      tags:
      - Event
      parameters:
      - name: size
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: "#/components/schemas/Event"
                - $ref: "#/components/schemas/Page"
  /api/v1/event/{eventId}/restore:
