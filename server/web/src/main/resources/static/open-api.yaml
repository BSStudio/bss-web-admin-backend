      summary: Read metrics
      description: Read metrics
      tags:
      - Metrics
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BssMetrics"
security:
- basicAuth: []
components:
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
  parameters:
    memberId:
      name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    videoId:
      name: videoId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    eventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    revision:
      name: revision
      in: path
      required: true
      schema:
        type: integer
        format: int64
  schemas:
    Sort:
      type: object
      properties:
        direction:
          type: string
          enum:
          - ASC
          - DESC
        property:
          type: string
        ignoreCase:
          type: boolean
        nullHandling:
          type: string
          enum:
          - NATIVE
          - NULLS_FIRST
          - NULLS_LAST
        ascending:
          type: boolean
        descending:
          type: boolean
    Pageable:
      type: object
      properties:
        pageNumber:
          type: integer
        pageSize:
          type: integer
        sort:
          $ref: "#/components/schemas/Sort"
        offset:
          type: integer
        paged:
          type: boolean
        unpaged:
          type: boolean
    Page:
      type: object
      properties:
        pageable:
          $ref: "#/components/schemas/Pageable"
        last:
          type: boolean
        totalPages:
          type: integer
        totalElements:
          type: integer
        first:
          type: boolean
        size:
          type: integer
        number:
          type: integer
        sort:
          $ref: "#/components/schemas/Sort"
        numberOfElements:
          type: integer
        empty:
          type: boolean
    Status:
      type: string
      nullable: false
      enum:
      - ALUMNI
      - ACTIVE_ALUMNI
      - MEMBER
      - MEMBER_CANDIDATE
      - MEMBER_CANDIDATE_CANDIDATE
    CreateMember:
      type: object
      properties:
        url:
          type: string
          nullable: false
        name:
          type: string
          nullable: false
    UpdateMember:
      allOf:
      - $ref: "#/components/schemas/CreateMember"
      - type: object
        properties:
          nickname:
            type: string
            nullable: false
          description:
            type: string
            nullable: false
          joinedAt:
            type: string
            nullable: false
          role:
            type: string
            nullable: false
          status:
            $ref: "#/components/schemas/Status"
          archived:
            type: boolean
            nullable: false
    Member:
      allOf:
      - type: object
        properties:
          id:
            type: string
            format: uuid
            nullable: false
      - $ref: "#/components/schemas/UpdateMember"
    CreateVideo:
      type: object
      properties:
        title:
          type: string
          nullable: false
    UpdateVideo:
      allOf:
      - $ref: "#/components/schemas/CreateVideo"
      - type: object
        properties:
          urls:
            type: array
            items:
              type: string
            nullable: false
          description:
            type: string
            nullable: false
          shootingDateStart:
            type: string
            format: date
            nullable: false
          shootingDateEnd:
            type: string
            format: date
            nullable: false
          visible:
            type: boolean
            nullable: false
          labels:
            type: array
            items:
              type: string
            nullable: false
    Video:
      allOf:
      - type: object
        properties:
          id:
            type: string
            format: uuid
            nullable: false
      - $ref: "#/components/schemas/UpdateVideo"
    DetailedVideo:
      allOf:
      - $ref: "#/components/schemas/Video"
      - type: object
        properties:
          crew:
            type: array
            items:
              $ref: "#/components/schemas/VideoCrew"
    VideoCrew:
      type: object
      properties:
        videoId:
          type: string
          format: uuid
        position:
          type: string
        member:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            nickname:
              type: string
    CreateLabel:
      type: object
      properties:
        name:
          type: string
          nullable: false
        description:
          type: string
          nullable: false
    Label:
      allOf:
      - type: object
        properties:
          id:
            type: string
            format: uuid
            nullable: false
          videoCount:
            type: integer
            format: int64
            readOnly: true
            description: How many videos have the label
      - $ref: "#/components/schemas/CreateLabel"
    CreateEvent:
      type: object
      properties:
        url:
          type: string
        title:
          type: string
    UpdateEvent:
      allOf:
      - $ref: "#/components/schemas/CreateEvent"
      - type: object
        properties:
          description:
            type: string
          dateFrom:
            type: string
            format: date
          dateTo:
            type: string
            format: date
          visible:
            type: boolean
    Event:
      allOf:
      - type: object
        properties:
          id:
            type: string
            format: uuid
          videoCount:
            type: integer
            format: int64
            readOnly: true
            description: How many videos the event has
      - $ref: "#/components/schemas/UpdateEvent"
    DetailedEvent:
      allOf:
      - $ref: "#/components/schemas/Event"
      - type: object
        properties:
          videos:
            type: array
            items:
              $ref: "#/components/schemas/Video"
    RevisionInfo:
      type: object
      properties:
        number:
          type: integer
          format: int64
        timestamp:
          type: string
          format: date-time
        author:
          type: string
          nullable: true
          description: "Who made the change, or null if nobody was signed in"
        type:
          type: string
          enum:
          - CREATED
          - UPDATED
          - DELETED
          - RESTORED
    BssMetrics:
      type: object
      properties:
        videoCount:
          type: integer
        eventCount:
          type: integer
        memberCount:
          type: integer
        labelCount:
          type: integer
