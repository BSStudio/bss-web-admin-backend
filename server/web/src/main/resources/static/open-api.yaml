                  $ref: "#/components/schemas/RevisionInfo"
  /api/v1/event/{eventId}/revisions/{revision}:
    get:
      operationId: getEventRevision
      summary: Read event at a revision
      description: "Read a event as it was at a revision. Its videos have no history,\
        \ so its video count is 0."
      tags:
      - Event
      parameters:
      - $ref: "#/components/parameters/eventId"
      - $ref: "#/components/parameters/revision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Event"
        "404":
          description: The event has no such revision
  /api/v1/event/{eventId}/revisions/{revision}/restore:
    post:
      operationId: restoreEventRevision
      summary: Restore event to a revision
      description: Give a event the fields it had at a revision. A deleted event has
        to be restored first.
      tags:
      - Event
      parameters:
      - $ref: "#/components/parameters/eventId"
      - $ref: "#/components/parameters/revision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedEvent"
        "404":
          description: "The event is deleted, or has no such revision"
        "409":
