        "409":
          description: Another event has taken its title or URL since
  /api/v1/event/{eventId}/revisions:
    get:
      operationId: getEventRevisions
      summary: Read the revisions of event
      description: "Read the changes of a event, newest first, including the ones\
        \ made while it was deleted"
      tags:
