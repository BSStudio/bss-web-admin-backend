                  $ref: "#/components/schemas/RevisionInfo"
  /api/v1/video/{videoId}/revisions/{revision}:
    get:
      operationId: getVideoRevision
      summary: Read video at a revision
      description: "Read a video as it was at a revision. Its crew has no history,\
