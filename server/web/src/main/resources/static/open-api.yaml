          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedVideo"
        "404":
          description: The video has no such revision
  /api/v1/video/{videoId}/revisions/{revision}/restore:
    post:
      operationId: restoreVideoRevision
      summary: Restore video to a revision
      description: Give a video the fields it had at a revision. A deleted video has
        to be restored first.
      tags:
      - Video
      parameters:
      - $ref: "#/components/parameters/videoId"
      - $ref: "#/components/parameters/revision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedVideo"
        "404":
          description: "The video is deleted, or has no such revision"
        "409":
