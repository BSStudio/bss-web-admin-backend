        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: "#/components/schemas/Video"
                - $ref: "#/components/schemas/Page"
  /api/v1/video/visible:
    put:
      operationId: changeVideoVisibility
      summary: Change video visibility
      description: Change video visibility
      tags:
      - Video
      parameters:
      - name: videoIds
        in: query
        required: true
        explode: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: visible
        in: query
        required: true
        schema:
          type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
  /api/v1/video/{videoId}:
    put:
      operationId: updateVideo
      summary: Update video
