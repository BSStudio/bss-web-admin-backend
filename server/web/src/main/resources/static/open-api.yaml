  /api/v1/videoCrew:
    put:
      operationId: addPosition
      summary: Add position with member to the video
      description: Add position with member to the video
      tags:
      - VideoCrew
      parameters:
      - name: videoId
        in: query
        required: true
        schema:
          type: string
      - name: position
        in: query
        required: true
        schema:
          type: string
      - name: memberId
        in: query
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedVideo"
        "404":
          description: Not found
    delete:
      operationId: removePosition
      summary: Delete position with member to the video
      description: Delete position with member to the video
      tags:
      - VideoCrew
      parameters:
      - name: videoId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: position
        in: query
        required: true
        schema:
          type: string
      - name: memberId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
