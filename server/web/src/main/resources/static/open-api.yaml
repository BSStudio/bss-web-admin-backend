            application/json:
              schema:
                $ref: "#/components/schemas/DetailedVideo"
    get:
      operationId: getVideo
      summary: Read one video
      description: Read one video
      tags:
      - Video
      parameters:
      - $ref: "#/components/parameters/videoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedVideo"
    delete:
      operationId: deleteVideo
      summary: Delete video
      description: Delete video
      tags:
      - Video
      parameters:
      - $ref: "#/components/parameters/videoId"
      responses:
        "204":
          description: No content
  /api/v1/video/deleted:
    get:
      operationId: getDeletedVideos
      summary: Read the deleted videos (paginated)
      description: Read the deleted videos (paginated). A deleted video is left out
        of every other endpoint until it is restored.
      tags:
      - Video
      parameters:
      - name: size
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: "#/components/schemas/Video"
                - $ref: "#/components/schemas/Page"
  /api/v1/video/{videoId}/restore:
    post:
      operationId: restoreVideo
      summary: Restore deleted video
      description: Restore a deleted video
      tags:
      - Video
      parameters:
      - $ref: "#/components/parameters/videoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedVideo"
        "404":
          description: No deleted video has the id
        "409":
          description: Another video has taken its title or URL since
  /api/v1/video/{videoId}/revisions:
    get:
      operationId: getVideoRevisions
      summary: Read the revisions of video
      description: "Read the changes of a video, newest first, including the ones\
        \ made while it was deleted"
      tags:
      - Video
      parameters:
      - $ref: "#/components/parameters/videoId"
      responses:
        "200":
          description: OK
          content:
            application/json:
