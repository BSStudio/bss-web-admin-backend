      operationId: addVideoToEvent
      summary: Add video to event
      description: Add video to event
      tags:
      - EventVideo
      parameters:
      - name: eventId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: videoId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DetailedEvent"
    delete:
      operationId: removeVideoFromEvent
      summary: Delete video from event
      description: Delete video from event
      tags:
      - EventVideo
      parameters:
      - name: eventId
        in: query
        required: true
        schema:
          type: string
          format: uuid
      - name: videoId
        in: query
        required: true
        schema:
          type: string
          format: uuid
