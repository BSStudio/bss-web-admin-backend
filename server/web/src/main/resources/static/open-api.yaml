openapi: 3.0.0
info:
  title: BSS Web admin API
  description: BSS Web admin API
  version: 1.0.0
  contact:
    name: Bence Csik
    url: https://github.com/csikb
servers:
- description: Local
  url: /
- description: Integration
  url: https://dev-admin.bsstudio.hu
- description: Production
  url: https://admin.bsstudio.hu
tags:
- name: Member
  description: REST operations for members
- name: Video
  description: REST operations for videos
- name: VideoCrew
  description: REST operations for video crews
- name: Label
  description: REST operations for labels
- name: Event
  description: REST operations for events
- name: EventVideo
  description: REST operations for event videos
- name: Metrics
  description: REST operations for metrics
paths:
  /api/v1/member:
    post:
      operationId: createMember
      summary: Create member
      description: Create member
      tags:
      - Member
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMember"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    get:
      operationId: getAllMembers
      summary: Read all member
      description: Read all member
      tags:
      - Member
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
  /api/v1/member/{memberId}:
    put:
      operationId: updateMember
      summary: Update member
      description: Update member
      tags:
      - Member
      parameters:
      - $ref: "#/components/parameters/memberId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMember"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    get:
      operationId: getMemberById
      summary: Read one member
      description: Read one member
      tags:
      - Member
      parameters:
      - $ref: "#/components/parameters/memberId"
      responses:
        "200":
          description: Ok
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: removeMember
      summary: Delete member
      description: Delete member
      tags:
      - Member
      parameters:
      - $ref: "#/components/parameters/memberId"
      responses:
        "204":
          description: No content
  /api/v1/member/deleted:
    get:
      operationId: getDeletedMembers
      summary: Read the deleted members (paginated)
      description: Read the deleted members (paginated). A deleted member is left
        out of every other endpoint until it is restored.
      tags:
      - Member
      parameters:
      - name: size
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: sort
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - type: object
                  properties:
                    content:
                      type: array
                      items:
                        $ref: "#/components/schemas/Member"
                - $ref: "#/components/schemas/Page"
  /api/v1/member/{memberId}/restore:
    post:
      operationId: restoreMember
      summary: Restore deleted member
      description: Restore a deleted member
      tags:
      - Member
      parameters:
      - $ref: "#/components/parameters/memberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: No deleted member has the id
        "409":
          description: Another member has taken its title or URL since
  /api/v1/member/{memberId}/revisions:
    get:
      operationId: getMemberRevisions
      summary: Read the revisions of member
      description: "Read the changes of a member, newest first, including the ones\
        \ made while it was deleted"
      tags:
      - Member
      parameters:
      - $ref: "#/components/parameters/memberId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RevisionInfo"
  /api/v1/member/{memberId}/revisions/{revision}:
    get:
      operationId: getMemberRevision
      summary: Read member at a revision
      description: Read a member as it was at a revision.
      tags:
      - Member
      parameters:
      - $ref: "#/components/parameters/memberId"
      - $ref: "#/components/parameters/revision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: The member has no such revision
  /api/v1/member/{memberId}/revisions/{revision}/restore:
    post:
      operationId: restoreMemberRevision
      summary: Restore member to a revision
      description: Give a member the fields it had at a revision. A deleted member
        has to be restored first.
      tags:
      - Member
      parameters:
      - $ref: "#/components/parameters/memberId"
      - $ref: "#/components/parameters/revision"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: "The member is deleted, or has no such revision"
        "409":
          description: Another member has taken its title or URL since
  /api/v1/video:
    post:
      operationId: createVideo
      summary: Create video
      description: Create video
      tags:
      - Video
      requestBody:
