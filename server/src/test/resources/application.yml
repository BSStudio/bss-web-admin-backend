bss:
  file-api:
    url: http://localhost:8888
    username: username
    password: password
spring:
  datasource:
    url: jdbc:tc:postgresql:16.3-alpine3.18:///db?currentSchema=private
  security:
    oauth2:
      resourceserver:
        opaquetoken:
          introspection-uri: http://localhost:8888
          client-id: client-id
          client-secret: client-secret
      client:
        registration:
          authentik:
            client-id: client-id
            client-secret: client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope: "openid,profile,email"
        provider:
          authentik:
            authorization-uri: http://localhost:8998/login/authorize
            token-uri: http://localhost:8998/login/token
            user-info-uri: http://localhost:8998/login/userinfo
            user-name-attribute: sub
