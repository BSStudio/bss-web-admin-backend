spring:
  application:
    name: BSS Web admin API
  jpa:
    open-in-view: false
  messages:
    fallback-to-system-locale: false
  mvc:
    format:
      date: iso
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
springdoc:
  swagger-ui:
    url: /open-api.yaml
    display-request-duration: true
    use-root-path: true
  enable-spring-security: true
  show-actuator: true
