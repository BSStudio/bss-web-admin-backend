spring:
  application:
    name: BSS Web admin API
  jpa:
    open-in-view: false
  web:
    resources:
      cache:
        cachecontrol:
          cache-public: true
          max-age: 365d
      chain:
        strategy:
          content:
            enabled: true
            paths:
            - /css/**
            - /js/**
            - /icons/**
            - /webjars/**
server:
  forward-headers-strategy: native
springdoc:
  swagger-ui:
    url: /open-api.yaml
    display-request-duration: true
  enable-spring-security: true
  show-actuator: true
