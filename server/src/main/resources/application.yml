spring:
  application:
    name: BSS Web admin API
  docker:
    compose:
      profiles:
        active: app
  jpa:
    open-in-view: false
springdoc:
  swagger-ui:
    url: /open-api.yaml
    display-request-duration: true
    use-root-path: true
  enable-spring-security: true
  show-actuator: true
