<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'members')}">
<head>
    <title th:text="|${member.name} · #{app.title}|">Kovács Anna · BSS admin</title>
</head>
<body>
<main id="main" class="container" th:assert="${member != null}, ${form != null}, ${statuses != null}">
    <div class="page-header">
        <div>
            <nav th:aria-label="#{nav.breadcrumb}">
                <ol class="cds--breadcrumb">
                    <li class="cds--breadcrumb-item"><a class="cds--link" th:href="@{/members}" th:text="#{member.list.title}">Members</a></li>
                </ol>
            </nav>
            <h1 th:text="${member.name}">Kovács Anna</h1>
        </div>
        <button type="button" class="cds--btn cds--btn--danger--ghost" command="show-modal" commandfor="delete-dialog"
                th:text="#{member.delete.title}">Delete member</button>
    </div>

    <div class="columns">
        <form method="post" th:action="@{/members/{id}(id=${member.id})}" th:object="${form}" class="stack"
              th:data-unsaved="${#fields.hasAnyErrors()} ? 'pending' : 'track'">
            <div th:replace="~{admin/fragments :: formError}"></div>
            <div class="grid">
                <div class="cds--form-item">
                    <label for="name" class="cds--label" th:text="#{member.field.name}">Name</label>
                    <input type="text" class="cds--text-input" id="name" th:field="*{name}" required maxlength="250"
                           th:aria-invalid="${#fields.hasErrors('name')} ? 'true'"
                           th:aria-describedby="${#fields.hasErrors('name')} ? 'name-error'">
                    <small th:replace="~{admin/fragments :: fieldError('name')}"></small>
                </div>
                <div class="cds--form-item">
                    <label for="nickname" class="cds--label" th:text="#{member.field.nickname}">Nickname</label>
                    <input type="text" class="cds--text-input" id="nickname" th:field="*{nickname}" maxlength="250"
                           th:aria-invalid="${#fields.hasErrors('nickname')} ? 'true'"
                           th:aria-describedby="${#fields.hasErrors('nickname')} ? 'nickname-error'">
                    <small th:replace="~{admin/fragments :: fieldError('nickname')}"></small>
                </div>
            </div>
            <div class="grid">
                <div class="cds--form-item">
                    <label for="url" class="cds--label" th:text="#{member.field.url}">URL</label>
                    <input type="text" class="cds--text-input" id="url" th:field="*{url}" required maxlength="250"
                           th:aria-invalid="${#fields.hasErrors('url')} ? 'true'"
                           th:aria-describedby="${#fields.hasErrors('url')} ? 'url-help url-error' : 'url-help'">
                    <small id="url-help" class="cds--form__helper-text" th:text="#{member.field.url.help}">Used in the member’s page address.</small>
                    <small th:replace="~{admin/fragments :: fieldError('url')}"></small>
                </div>
                <div class="cds--form-item">
                    <label for="role" class="cds--label" th:text="#{member.field.role}">Role</label>
                    <input type="text" class="cds--text-input" id="role" th:field="*{role}" maxlength="250"
                           th:aria-invalid="${#fields.hasErrors('role')} ? 'true'"
                           th:aria-describedby="${#fields.hasErrors('role')} ? 'role-error'">
                    <small th:replace="~{admin/fragments :: fieldError('role')}"></small>
                </div>
            </div>
            <div class="grid">
                <div class="cds--form-item cds--select">
                    <label for="status" class="cds--label" th:text="#{member.field.status}">Status</label>
                    <div class="cds--select-input__wrapper">
                        <select class="cds--select-input" id="status" th:field="*{status}"
                                th:aria-invalid="${#fields.hasErrors('status')} ? 'true'"
                                th:aria-describedby="${#fields.hasErrors('status')} ? 'status-error'">
                            <option th:each="s : ${statuses}" th:value="${s}" th:text="#{${'member.status.' + s}}">Member</option>
                        </select>
                        <svg th:replace="~{admin/fragments :: icon('chevron--down', 16, 'cds--select__arrow')}"></svg>
                    </div>
                    <small th:replace="~{admin/fragments :: fieldError('status')}"></small>
                </div>
                <div class="cds--form-item">
                    <label for="joinedAt" class="cds--label" th:text="#{member.field.joinedAt}">Joined</label>
                    <input type="date" class="cds--text-input" id="joinedAt" th:field="*{joinedAt}" required
                           th:aria-invalid="${#fields.hasErrors('joinedAt')} ? 'true'"
                           th:aria-describedby="${#fields.hasErrors('joinedAt')} ? 'joinedAt-error'">
                    <small th:replace="~{admin/fragments :: fieldError('joinedAt')}"></small>
                </div>
            </div>
            <div class="cds--form-item">
                <label for="description" class="cds--label" th:text="#{member.field.description}">Description</label>
                <textarea class="cds--text-area" id="description" th:field="*{description}" rows="4" maxlength="2000"
                          th:aria-invalid="${#fields.hasErrors('description')} ? 'true'"
                          th:aria-describedby="${#fields.hasErrors('description')} ? 'description-error'"></textarea>
                <small th:replace="~{admin/fragments :: fieldError('description')}"></small>
            </div>
            <!--/* Written out instead of th:field: its hidden marker would come between the box and its label */-->
            <div class="cds--form-item cds--checkbox-wrapper">
                <input type="hidden" name="_archived" value="on">
                <input type="checkbox" class="cds--checkbox" id="archived" name="archived" value="true" th:checked="*{archived}">
                <label class="cds--checkbox-label" for="archived">
                    <span class="cds--checkbox-label-text" th:text="#{member.field.archived.help}">Archived: no longer an active member</span>
                </label>
            </div>
            <div class="cds--btn-set actions">
                <a class="cds--btn cds--btn--secondary" th:href="@{/members}" th:text="#{action.cancel}">Cancel</a>
                <button type="submit" class="cds--btn cds--btn--primary" th:text="#{action.save}">Save</button>
                <span class="unsaved" role="status" th:data-message="#{form.unsaved}"></span>
            </div>
        </form>

        <section class="cds--tile panel">
            <h2 th:text="#{member.picture.title}">Profile picture</h2>
            <div th:replace="~{admin/fragments :: imagePlaceholder('portrait')}"></div>
        </section>
    </div>

    <dialog th:replace="~{admin/fragments :: deleteDialog('delete-dialog', @{/members/{id}/delete(id=${member.id})},
            #{member.delete.question(${member.name})}, #{member.delete.warning})}"></dialog>
</main>

</body>
</html>
