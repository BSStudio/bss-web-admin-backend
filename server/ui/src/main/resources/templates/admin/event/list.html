<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'events')}">
<head>
    <title th:text="|#{event.list.title} · #{app.title}|">Events · BSS admin</title>
</head>
<body>
<main id="main" class="container">
    <div class="page-header">
        <h1 th:text="#{event.list.title}">Events</h1>
    </div>

    <div class="table-toolbar">
        <div class="toolbar-actions">
            <search th:replace="~{admin/fragments :: search('/admin/events', ${page})}"></search>
            <details class="dropdown column-picker">
                <summary th:text="#{table.columns}">Columns</summary>
                <ul>
                    <li th:replace="~{admin/fragments :: column('url', #{event.field.url}, true)}"></li>
                    <li th:replace="~{admin/fragments :: column('date', #{event.column.dates}, true)}"></li>
                    <li th:replace="~{admin/fragments :: column('description', #{event.field.description}, false)}"></li>
                </ul>
            </details>
            <a class="button" th:href="@{/admin/events/new}" th:text="#{event.list.new}">New event</a>
        </div>
    </div>

    <div id="results">
        <div class="data-table">
            <table>
                <thead>
                <tr>
                    <th scope="col" th:text="#{event.field.title}">Title</th>
                    <th scope="col" class="col-url hide-small" th:text="#{event.field.url}">URL</th>
                    <th scope="col" class="col-date" th:text="#{event.column.dates}">Dates</th>
                    <th scope="col" class="col-description" th:text="#{event.field.description}">Description</th>
                    <th scope="col" th:text="#{event.column.visible}">Visible</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="5" class="muted"
                        th:text="${q.isBlank()} ? #{event.list.empty} : #{table.noMatch(${q})}">No events yet.</td>
                </tr>
                <tr th:each="e : ${page.content}">
                    <td><a th:href="@{/admin/events/{id}(id=${e.id})}" th:text="${e.title}">Gólyatábor 2026</a></td>
                    <td class="muted col-url hide-small" th:text="${e.url}">golyatabor-2026</td>
                    <td class="date col-date"
                        th:text="${e.dateFrom == e.dateTo} ? ${e.dateFrom} : |${e.dateFrom} – ${e.dateTo}|">
                        2026-08-12 – 2026-08-15
                    </td>
                    <td class="muted clip col-description" th:text="${e.description}" th:title="${e.description}">
                        Az idei gólyatábor.
                    </td>
                    <td th:replace="~{admin/event/list :: visibility(id=${e.id}, title=${e.title}, visible=${e.visible})}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{admin/fragments :: pagination(${page}, '/admin/events')}"></nav>
    </div>
</main>

<!--/* Fragments rendered on their own by htmx requests */-->
<table th:remove="all">
    <thead>
    <tr>
        <th>Visible</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td th:fragment="visibility" class="select">
            <label>
                <span class="sr-only" th:text="#{event.list.toggle(${title})}">Show on the website</span>
                <input type="checkbox" role="switch" th:id="|visible-${id}|" th:checked="${visible}"
                       th:hx-put="@{/admin/events/{id}/visibility(id=${id}, visible=${!visible})}"
                       hx-target="closest td" hx-swap="outerHTML">
            </label>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
