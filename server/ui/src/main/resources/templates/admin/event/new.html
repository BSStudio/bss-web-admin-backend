<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'events')}">
<head>
    <title th:text="|#{event.new.title} · #{app.title}|">New event · BSS admin</title>
</head>
<body>
<main id="main" class="container" th:assert="${form != null}">
    <div class="page-header">
        <div>
            <nav class="breadcrumb" th:aria-label="#{nav.breadcrumb}">
                <a th:href="@{/admin/events}" th:text="#{event.list.title}">Events</a>
            </nav>
            <h1 th:text="#{event.new.title}">New event</h1>
        </div>
    </div>

    <form method="post" th:action="@{/admin/events}" th:object="${form}" class="stack narrow"
          th:data-unsaved="${#fields.hasAnyErrors()} ? 'pending' : 'track'">
        <p th:replace="~{admin/fragments :: formError}"></p>
        <label>
            <span th:text="#{event.field.title}">Title</span>
            <input type="text" th:field="*{title}" required maxlength="250" autofocus
                   th:aria-invalid="${#fields.hasErrors('title')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('title')} ? 'title-error'">
            <small th:replace="~{admin/fragments :: fieldError('title')}"></small>
        </label>
        <label>
            <span th:text="#{event.field.url}">URL</span>
            <input type="text" th:field="*{url}" required maxlength="250"
                   th:aria-invalid="${#fields.hasErrors('url')} ? 'true'"
                   th:aria-describedby="${#fields.hasErrors('url')} ? 'url-help url-error' : 'url-help'">
            <small id="url-help" th:text="#{event.field.url.help}">Used in the event’s page address.</small>
            <small th:replace="~{admin/fragments :: fieldError('url')}"></small>
        </label>
        <p class="muted" th:text="#{event.new.help}">Start with the title and URL.</p>
        <div class="actions">
            <a class="button secondary" th:href="@{/admin/events}" th:text="#{action.cancel}">Cancel</a>
            <button type="submit" th:text="#{action.create}">Create</button>
            <span class="unsaved" role="status" th:data-message="#{form.unsaved}"></span>
        </div>
    </form>
</main>
</body>
</html>
