<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'videos')}">
<head>
    <title th:text="|#{video.new.title} · #{app.title}|">New video · BSS admin</title>
</head>
<body>
<main id="main" class="container">
    <div class="page-header">
        <div>
            <nav class="breadcrumb" th:aria-label="#{nav.breadcrumb}">
                <a th:href="@{/admin/videos}" th:text="#{video.list.title}">Videos</a>
            </nav>
            <h1 th:text="#{video.new.title}">New video</h1>
        </div>
    </div>
    <p th:replace="~{admin/fragments :: error(${error})}"></p>

    <form method="post" th:action="@{/admin/videos}" class="stack narrow"
          th:data-unsaved="${error} ? 'pending' : 'track'">
        <label>
            <span th:text="#{video.field.title}">Title</span>
            <input type="text" name="title" th:value="${title}" required autofocus aria-describedby="title-help form-error"
                   th:aria-invalid="${error} ? 'true'">
            <small id="title-help" th:text="#{video.new.help}">Start with the title.</small>
        </label>
        <div class="actions">
            <a role="button" class="secondary" th:href="@{/admin/videos}" th:text="#{action.cancel}">Cancel</a>
            <button type="submit" th:text="#{action.create}">Create</button>
        </div>
    </form>
</main>
</body>
</html>
