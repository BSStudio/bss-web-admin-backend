<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'videos')}">
<head>
    <title th:text="|#{video.list.title} · #{app.title}|">Videos · BSS admin</title>
</head>
<body>
<main id="main" class="container" th:assert="${page != null}, ${q != null}, ${sorting != null}">
    <div class="page-header">
        <h1 th:text="#{video.list.title}">Videos</h1>
    </div>

    <section class="cds--table-toolbar table-toolbar" th:aria-label="#{table.toolbar}">
        <form id="bulk" method="post" th:action="@{/videos/visibility}" class="cds--batch-actions batch-actions">
            <div class="cds--batch-summary">
                <p class="cds--batch-summary__para">
                    <span class="selected-count" th:data-template="#{table.selected}" th:text="#{video.list.batch}">Selected videos</span>
                </p>
            </div>
            <div class="cds--action-list">
                <button type="submit" class="cds--btn cds--btn--primary" name="visible" value="true" th:text="#{video.list.publish}">Publish</button>
                <button type="submit" class="cds--btn cds--btn--primary" name="visible" value="false" th:text="#{video.list.hide}">Hide</button>
                <button type="reset" class="cds--btn cds--btn--primary cds--batch-summary__cancel" th:text="#{action.cancel}">Cancel</button>
            </div>
        </form>
        <div class="cds--toolbar-content toolbar-actions">
            <search th:replace="~{admin/fragments :: search('/videos', ${page})}"></search>
            <a class="cds--btn cds--btn--primary" th:href="@{/videos/new}">
                <span th:text="#{video.list.new}">New video</span>
                <svg th:replace="~{admin/fragments :: icon('add', 16, 'cds--btn__icon')}"></svg>
            </a>
        </div>
    </section>

    <!--/* htmx requests get only this part: see the controller */-->
    <div id="results" th:fragment="results">
        <div class="cds--data-table-content data-table">
            <table class="cds--data-table cds--data-table--md">
                <caption class="sr-only" th:text="#{video.list.title}">Videos</caption>
                <thead>
                <tr>
                    <th th:replace="~{admin/fragments :: selectAll('videoIds')}"></th>
                    <th th:replace="~{admin/fragments :: sortable('/videos', ${page}, 'title', #{video.field.title}, '')}"></th>
                    <th scope="col" class="hide-small"><span class="cds--table-header-label" th:text="#{video.column.url}">URL</span></th>
                    <th th:replace="~{admin/fragments :: sortable('/videos', ${page}, 'shootingDateStart', #{video.field.shot}, '')}"></th>
                    <th th:replace="~{admin/fragments :: sortable('/videos', ${page}, 'visible', #{video.column.visible}, '')}"></th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="5" class="muted"
                        th:text="${q.isBlank()} ? #{video.list.empty} : #{table.noMatch(${q})}">No videos yet.</td>
                </tr>
                <tr th:each="v : ${page.content}">
                    <td th:replace="~{admin/fragments :: selectRow('videoIds', ${v.id}, #{video.list.select(${v.title})})}"></td>
                    <td><a class="cds--link" th:href="@{/videos/{id}(id=${v.id})}" th:text="${v.title}">Gólyatábor 2026 - Vám</a></td>
                    <td class="muted hide-small" th:text="${v.urls.isEmpty()} ? '' : ${v.urls[0]}">golyatabor-2026-vam</td>
                    <td class="date"
                        th:insert="~{admin/fragments :: dates(${v.shootingDateStart}, ${v.shootingDateEnd})}">Aug 13, 2026</td>
                    <td th:replace="~{admin/video/list :: visibility(id=${v.id}, title=${v.title}, visible=${v.visible})}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{admin/fragments :: pagination(${page}, '/videos')}"></nav>
    </div>
</main>

<!--/* Fragments rendered on their own by htmx requests */-->
<table th:remove="all">
    <thead>
    <tr>
        <th>Visible</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td th:fragment="visibility" th:assert="${id != null}" class="select">
            <div th:replace="~{admin/fragments :: switch(|visible-${id}|, ${visible}, #{video.list.toggle(${title})},
                    #{visibility.shown}, #{visibility.hidden}, @{/videos/{id}/visibility(id=${id}, visible=${!visible})})}"></div>
            <!--/* The database refuses to show a video while one of its events is hidden */-->
            <small th:if="${inHiddenEvent}" class="field-error" role="alert" th:text="#{video.list.inHiddenEvent}">
                Its event is hidden.
            </small>
            <!--/* After a change, a toast says what happened (htmx adds it to #toasts) */-->
            <th:block th:if="${toast}"><div hx-swap-oob="beforeend:#toasts"><div th:replace="~{admin/fragments :: toast(${toast})}"></div></div></th:block>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
