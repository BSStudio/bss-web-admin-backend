<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'videos')}">
<head>
    <title th:text="|#{video.list.title} · #{app.title}|">Videos · BSS admin</title>
</head>
<body>
<main id="main" class="container">
    <div class="page-header">
        <h1 th:text="#{video.list.title}">Videos</h1>
    </div>

    <div class="table-toolbar">
        <form id="bulk" method="post" th:action="@{/admin/videos/visibility}" class="batch-actions">
            <span class="selected-count" th:data-template="#{table.selected}" th:text="#{video.list.batch}">Selected videos</span>
            <button type="submit" name="visible" value="true" th:text="#{video.list.publish}">Publish</button>
            <button type="submit" name="visible" value="false" th:text="#{video.list.hide}">Hide</button>
            <button type="reset" th:text="#{action.cancel}">Cancel</button>
        </form>
        <div class="toolbar-actions">
            <search th:replace="~{admin/fragments :: search('/admin/videos', ${page})}"></search>
            <details class="dropdown column-picker">
                <summary th:text="#{table.columns}">Columns</summary>
                <ul>
                    <th:block th:if="${media.enabled}">
                        <li th:replace="~{admin/fragments :: column('image', #{video.thumbnail.title}, true)}"></li>
                    </th:block>
                    <li th:replace="~{admin/fragments :: column('url', #{video.column.url}, true)}"></li>
                    <li th:replace="~{admin/fragments :: column('date', #{video.field.shot}, true)}"></li>
                    <li th:replace="~{admin/fragments :: column('description', #{video.field.description}, false)}"></li>
                </ul>
            </details>
            <a class="button" th:href="@{/admin/videos/new}" th:text="#{video.list.new}">New video</a>
        </div>
    </div>

    <div id="results">
        <div class="data-table">
            <table>
                <thead>
                <tr>
                    <th th:replace="~{admin/fragments :: selectAll('videoIds')}"></th>
                    <th scope="col" class="col-image" th:if="${media.enabled}"><span class="sr-only" th:text="#{video.thumbnail.title}">Thumbnail</span></th>
                    <th scope="col" th:text="#{video.field.title}">Title</th>
                    <th scope="col" class="col-url hide-small" th:text="#{video.column.url}">URL</th>
                    <th scope="col" class="col-date" th:text="#{video.field.shot}">Shot</th>
                    <th scope="col" class="col-description" th:text="#{video.field.description}">Description</th>
                    <th scope="col" th:text="#{video.column.visible}">Visible</th>
                </tr>
                </thead>
                <tbody>
                <tr th:if="${page.empty}">
                    <td colspan="7" class="muted"
                        th:text="${q.isBlank()} ? #{video.list.empty} : #{table.noMatch(${q})}">No videos yet.</td>
                </tr>
                <tr th:each="v : ${page.content}">
                    <td class="select">
                        <label>
                            <span class="sr-only" th:text="#{video.list.select(${v.title})}">Select</span>
                            <input type="checkbox" name="videoIds" form="bulk" th:value="${v.id}">
                        </label>
                    </td>
                    <td class="thumb-cell col-image" th:if="${media.enabled}">
                        <div th:replace="~{admin/fragments :: picture(${media.video(v.id)}, '56px', null, '', '', 'thumb')}"></div>
                    </td>
                    <td><a th:href="@{/admin/videos/{id}(id=${v.id})}" th:text="${v.title}">Gólyatábor 2026 - Vám</a></td>
                    <td class="muted col-url hide-small" th:text="${v.urls.isEmpty()} ? '' : ${v.urls[0]}">golyatabor-2026-vam</td>
                    <td class="date col-date"
                        th:text="${v.shootingDateStart == v.shootingDateEnd} ? ${v.shootingDateStart} : |${v.shootingDateStart} – ${v.shootingDateEnd}|">
                        2026-08-13
                    </td>
                    <td class="muted clip col-description" th:text="${v.description}" th:title="${v.description}">
                        Az idei gólyatábor vámja.
                    </td>
                    <td th:replace="~{admin/video/list :: visibility(id=${v.id}, title=${v.title}, visible=${v.visible})}"></td>
                </tr>
                </tbody>
            </table>
        </div>
        <nav th:replace="~{admin/fragments :: pagination(${page}, '/admin/videos')}"></nav>
    </div>
</main>

<!--/* Fragments rendered on their own by htmx requests */-->
<table th:remove="all">
    <thead>
    <tr>
        <th>Visible</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td th:fragment="visibility" class="select">
            <label>
                <span class="sr-only" th:text="#{video.list.toggle(${title})}">Show on the website</span>
                <input type="checkbox" role="switch" th:id="|visible-${id}|" th:checked="${visible}"
                       th:hx-put="@{/admin/videos/{id}/visibility(id=${id}, visible=${!visible})}"
                       hx-target="closest td" hx-swap="outerHTML">
            </label>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
