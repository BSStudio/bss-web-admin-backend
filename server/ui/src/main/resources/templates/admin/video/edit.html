<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{admin/layout :: layout(~{::title}, ~{::main}, 'videos')}">
<head>
    <title th:text="|${video.title} · #{app.title}|">Gólyatábor 2026 - Vám · BSS admin</title>
</head>
<body>
<main id="main" class="container" th:assert="${video != null}, ${form != null}, ${labels != null}">
    <div class="page-header">
        <div>
            <nav th:aria-label="#{nav.breadcrumb}">
                <ol class="cds--breadcrumb">
                    <li class="cds--breadcrumb-item"><a class="cds--link" th:href="@{/admin/videos}" th:text="#{video.list.title}">Videos</a></li>
                </ol>
            </nav>
            <h1 th:text="${video.title}">Gólyatábor 2026 - Vám</h1>
        </div>
        <button type="button" class="cds--btn cds--btn--danger--ghost" command="show-modal" commandfor="delete-dialog"
                th:text="#{video.delete.title}">Delete video</button>
    </div>

    <div class="columns">
        <form method="post" th:action="@{/admin/videos/{id}(id=${video.id})}" th:object="${form}" class="stack"
              th:data-unsaved="${#fields.hasAnyErrors()} ? 'pending' : 'track'">
            <div th:replace="~{admin/fragments :: formError}"></div>
            <div class="cds--form-item">
                <label for="title" class="cds--label" th:text="#{video.field.title}">Title</label>
                <input type="text" class="cds--text-input" th:field="*{title}" required maxlength="250"
                       th:aria-invalid="${#fields.hasErrors('title')} ? 'true'"
                       th:aria-describedby="${#fields.hasErrors('title')} ? 'title-error'">
                <small th:replace="~{admin/fragments :: fieldError('title')}"></small>
            </div>
            <div class="grid">
                <div class="cds--form-item">
                    <label for="shootingDateStart" class="cds--label" th:text="#{video.field.shootingDateStart}">Shooting started</label>
                    <input type="date" class="cds--text-input" th:field="*{shootingDateStart}" required
                           th:aria-invalid="${#fields.hasErrors('shootingDateStart')} ? 'true'"
                           th:aria-describedby="${#fields.hasErrors('shootingDateStart')} ? 'shootingDateStart-error'">
                    <small th:replace="~{admin/fragments :: fieldError('shootingDateStart')}"></small>
                </div>
                <div class="cds--form-item">
                    <label for="shootingDateEnd" class="cds--label" th:text="#{video.field.shootingDateEnd}">Shooting ended</label>
                    <input type="date" class="cds--text-input" th:field="*{shootingDateEnd}" required
                           th:aria-invalid="${#fields.hasErrors('shootingDateEnd') or #fields.hasErrors('datesInOrder')} ? 'true'"
                           th:aria-describedby="${#fields.hasErrors('datesInOrder')} ? 'datesInOrder-error' : (${#fields.hasErrors('shootingDateEnd')} ? 'shootingDateEnd-error')">
                    <small th:replace="~{admin/fragments :: fieldError('shootingDateEnd')}"></small>
                    <small th:replace="~{admin/fragments :: fieldError('datesInOrder')}"></small>
                </div>
            </div>
            <div class="cds--form-item">
                <label for="urls" class="cds--label" th:text="#{video.field.urls}">URLs</label>
                <textarea class="cds--text-area" th:field="*{urls}" rows="2" aria-describedby="urls-help"></textarea>
                <small id="urls-help" class="cds--form__helper-text" th:text="#{video.field.urls.help}">One per line.</small>
            </div>
            <div class="cds--form-item">
                <label for="description" class="cds--label" th:text="#{video.field.description}">Description</label>
                <textarea class="cds--text-area" th:field="*{description}" rows="4" maxlength="2000"
                          th:aria-invalid="${#fields.hasErrors('description')} ? 'true'"
                          th:aria-describedby="${#fields.hasErrors('description')} ? 'description-error'"></textarea>
                <small th:replace="~{admin/fragments :: fieldError('description')}"></small>
            </div>
            <fieldset class="cds--fieldset cds--checkbox-group" th:unless="${labels.isEmpty()}">
                <legend class="cds--label" th:text="#{video.field.labels}">Labels</legend>
                <!--/*
                  Checkboxes are written out instead of th:field, whose hidden "_" marker would come between the box
                  and its label, which Carbon's stylesheet needs side by side. Spring reads the marker the same way.
                */-->
                <input type="hidden" name="_labels" value="on">
                <div class="checkboxes">
                    <div th:each="label, row : ${labels}" class="cds--checkbox-wrapper" th:title="${label.description}">
                        <input type="checkbox" class="cds--checkbox" name="labels" th:id="|labels-${row.count}|"
                               th:value="${label.name}" th:checked="${#lists.contains(form.labels, label.name)}">
                        <label class="cds--checkbox-label" th:for="|labels-${row.count}|">
                            <span class="cds--checkbox-label-text" th:text="${label.name}">Egyetemi élet</span>
                        </label>
                    </div>
                </div>
            </fieldset>
            <div class="cds--form-item cds--checkbox-wrapper">
                <input type="hidden" name="_visible" value="on">
                <input type="checkbox" class="cds--checkbox" id="visible" name="visible" value="true" th:checked="*{visible}"
                       th:aria-invalid="${#fields.hasErrors('visible')} ? 'true'"
                       th:aria-describedby="${#fields.hasErrors('visible')} ? 'visible-error'">
                <label class="cds--checkbox-label" for="visible">
                    <span class="cds--checkbox-label-text" th:text="#{video.field.visible}">Visible on the website</span>
                </label>
                <small th:replace="~{admin/fragments :: fieldError('visible')}"></small>
            </div>
            <div class="cds--btn-set actions">
                <a class="cds--btn cds--btn--secondary" th:href="@{/admin/videos}" th:text="#{action.cancel}">Cancel</a>
                <button type="submit" class="cds--btn cds--btn--primary" th:text="#{action.save}">Save</button>
                <span class="unsaved" role="status" th:data-message="#{form.unsaved}"></span>
            </div>
        </form>

        <div>
            <section class="cds--tile panel">
                <h2 th:text="#{video.thumbnail.title}">Thumbnail</h2>
                <div th:replace="~{admin/fragments :: imagePlaceholder('wide')}"></div>
            </section>
            <section th:replace="~{admin/video/edit :: crew}"></section>
        </div>
    </div>

    <dialog th:replace="~{admin/fragments :: deleteDialog('delete-dialog', @{/admin/videos/{id}/delete(id=${video.id})},
            #{video.delete.question(${video.title})}, #{video.delete.warning})}"></dialog>
</main>

<!--/* The crew panel re-renders on its own after each htmx add or remove */-->
<section id="crew" class="cds--tile panel" th:fragment="crew"
         th:assert="${video != null}, ${members != null}, ${positions != null}, ${newPosition != null}">
    <h2 th:text="#{video.crew.title}">Crew</h2>
    <p th:if="${video.crew.isEmpty()}" class="muted" th:text="#{video.crew.empty}">No crew yet.</p>
    <div class="cds--data-table-content data-table" th:unless="${video.crew.isEmpty()}">
        <table class="cds--data-table cds--data-table--sm">
            <caption class="sr-only" th:text="#{video.crew.title}">Crew</caption>
            <thead>
            <tr>
                <th scope="col"><span class="cds--table-header-label" th:text="#{video.crew.member}">Member</span></th>
                <th scope="col"><span class="cds--table-header-label" th:text="#{video.crew.position}">Position</span></th>
                <th scope="col"><span class="sr-only" th:text="#{table.actions}">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="crew : ${video.crew}">
                <td>
                    <span th:text="${crew.member.name}">Kovács Anna</span>
                    <span class="muted" th:if="${!crew.member.nickname.isBlank()}" th:text="|(${crew.member.nickname})|">(Panni)</span>
                </td>
                <td th:text="${crew.position}">Camera</td>
                <td class="row-action">
                    <button type="button" class="cds--btn cds--btn--ghost cds--btn--sm"
                            th:hx-delete="@{/admin/videos/{id}/crew(id=${video.id}, memberId=${crew.member.id}, position=${crew.position})}"
                            hx-target="#crew" hx-swap="outerHTML"
                            th:aria-label="#{video.crew.remove(${crew.member.name}, ${crew.position})}"
                            th:text="#{action.remove}">Remove</button>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
    <form class="inline-form" th:hx-post="@{/admin/videos/{id}/crew(id=${video.id})}" hx-target="#crew" hx-swap="outerHTML">
        <div class="cds--select">
            <label for="crew-member" class="cds--label cds--visually-hidden" th:text="#{video.crew.member}">Member</label>
            <div class="cds--select-input__wrapper">
                <select id="crew-member" name="memberId" class="cds--select-input" required th:autofocus="${crewChanged}">
                    <option value="" selected disabled th:text="#{video.crew.member}">Member</option>
                    <option th:each="m : ${members}" th:value="${m.id}" th:text="${m.name}">Kovács Anna</option>
                </select>
                <svg th:replace="~{admin/fragments :: icon('chevron--down', 16, 'cds--select__arrow')}"></svg>
            </div>
        </div>
        <div class="cds--select">
            <label for="crew-position" class="cds--label cds--visually-hidden" th:text="#{video.crew.position}">Position</label>
            <div class="cds--select-input__wrapper">
                <select id="crew-position" name="position" class="cds--select-input" required data-other="crew-new-position">
                    <option value="" selected disabled th:text="#{video.crew.position}">Position</option>
                    <option th:each="p : ${positions}" th:value="${p}" th:text="${p}">Operatőr</option>
                    <option th:value="${newPosition}" data-other th:text="#{video.crew.newPosition}">New position…</option>
                </select>
                <svg th:replace="~{admin/fragments :: icon('chevron--down', 16, 'cds--select__arrow')}"></svg>
            </div>
        </div>
        <!--/* Shown by admin.js while "New position…" is chosen */-->
        <div class="cds--form-item" hidden>
            <label for="crew-new-position" class="cds--label cds--visually-hidden" th:text="#{video.crew.newPosition.name}">Name of the new position</label>
            <input id="crew-new-position" class="cds--text-input" type="text" name="newPosition" maxlength="250"
                   th:placeholder="#{video.crew.newPosition.name}">
        </div>
        <button type="submit" class="cds--btn cds--btn--secondary" th:text="#{action.add}">Add</button>
    </form>
</section>
</body>
</html>
