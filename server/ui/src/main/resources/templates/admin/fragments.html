<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Shared fragments</title>
</head>
<body>

<!--/*
  Search above a table. Typing filters the rows: htmx loads the list into #results and updates the address.
  The page size stays; the page goes back to the first.
*/-->
<search th:fragment="search(path, page)" class="table-search">
    <form method="get" th:action="@{${path}}" th:hx-get="@{${path}}" hx-select="#results" hx-target="#results"
          hx-swap="outerHTML" hx-push-url="true">
        <label>
            <span class="sr-only" th:text="#{table.search}">Search</span>
            <input id="table-search" type="search" name="q" th:value="${q}" th:placeholder="#{table.search}"
                   autocomplete="off" th:hx-get="@{${path}}" hx-trigger="input changed delay:300ms"
                   hx-include="closest form">
        </label>
        <input type="hidden" name="size" th:value="${page.size}">
    </form>
</search>

<!--/* The header cell that selects every row on the page; name is the row checkboxes' name. See admin.js. */-->
<th th:fragment="selectAll(name)" scope="col" class="select">
    <label>
        <span class="sr-only" th:text="#{table.selectAll}">Select all rows</span>
        <input type="checkbox" th:data-select-all="${name}">
    </label>
</th>

<!--/*
  One choice in a table's Columns menu. Cells with the class col-<key> hide while it is unticked (admin.css
  has a rule for each key); admin.js remembers the choice in the browser.
*/-->
<li th:fragment="column(key, label, shown)">
    <label>
        <input type="checkbox" th:data-column="${key}" th:checked="${shown}">
        <span th:text="${label}">URL</span>
    </label>
</li>

<!--/*
  Footer of a data table: page size, which items are shown, and which page, as lists and arrows.
  A change loads that page into #results. The hidden fields tell the bulk actions where to come back to.
*/-->
<nav th:fragment="pagination(page, path)" th:unless="${page.empty}" class="pagination"
     th:aria-label="#{pagination.label}" hx-select="#results" hx-target="#results" hx-swap="outerHTML" hx-push-url="true">
    <form method="get" th:action="@{${path}}" th:hx-get="@{${path}}" hx-trigger="change">
        <input type="hidden" name="q" th:value="${q}">
        <label for="page-size" th:text="#{pagination.size}">Items per page:</label>
        <select id="page-size" name="size">
            <option th:each="size : ${ {10, 25, 50, 100} }" th:value="${size}" th:text="${size}"
                    th:selected="${size == page.size}">25</option>
        </select>
        <span th:text="#{pagination.items(${page.number * page.size + 1}, ${page.number * page.size + page.numberOfElements}, ${page.totalElements})}">1–25 of 120 items</span>
    </form>
    <form method="get" th:action="@{${path}}" th:hx-get="@{${path}}" hx-trigger="change" class="pages"
          th:with="previous=@{${path}(q=${q}, size=${page.size}, page=${page.number - 1})},
                   next=@{${path}(q=${q}, size=${page.size}, page=${page.number + 1})}">
        <input type="hidden" name="q" th:value="${q}">
        <input type="hidden" name="size" th:value="${page.size}">
        <select id="page-number" name="page" th:aria-label="#{pagination.page}">
            <option th:each="number : ${#numbers.sequence(0, page.totalPages - 1)}" th:value="${number}"
                    th:text="${number + 1}" th:selected="${number == page.number}">1</option>
        </select>
        <span th:text="#{pagination.pages(${page.totalPages})}">of 5 pages</span>
        <a th:if="${page.hasPrevious()}" th:href="${previous}" th:hx-get="${previous}"
           th:aria-label="#{pagination.previous}">‹</a>
        <span th:unless="${page.hasPrevious()}" class="disabled" aria-hidden="true">‹</span>
        <a th:if="${page.hasNext()}" th:href="${next}" th:hx-get="${next}" th:aria-label="#{pagination.next}">›</a>
        <span th:unless="${page.hasNext()}" class="disabled" aria-hidden="true">›</span>
    </form>
    <input type="hidden" form="bulk" name="q" th:value="${q}">
    <input type="hidden" form="bulk" name="page" th:value="${page.number}">
    <input type="hidden" form="bulk" name="size" th:value="${page.size}">
</nav>

<!--/*
  An image from the file API in AVIF, WebP or JPEG. kind sets the shape: wide, thumb, avatar or portrait.
  version busts the browser cache right after an upload. admin.js shows the "empty" text when there is no image yet.
*/-->
<div th:fragment="picture(base, size, version, alt, empty, kind)" th:if="${media.enabled}"
     th:class="|media-preview ${kind}|" th:data-empty="${empty}">
    <picture>
        <source th:srcset="|${base}/${size}.avif${version ?: ''}|" type="image/avif">
        <source th:srcset="|${base}/${size}.webp${version ?: ''}|" type="image/webp">
        <img th:src="|${base}/${size}.jpeg${version ?: ''}|" th:alt="${alt}" data-media loading="lazy">
    </picture>
</div>

<!--/* An error message above a form, e.g. after a unique constraint violation */-->
<p th:fragment="error(key)" th:if="${key}" id="form-error" class="flash error" role="alert" th:text="#{${key}}">Could not save.</p>

</body>
</html>
