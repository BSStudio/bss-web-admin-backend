<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:fragment="layout(title, content)"
      th:lang="${#locale.language}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:replace="${title}">BSS admin</title>
    <link rel="stylesheet" th:href="@{/admin/webjars/picocss__pico/css/pico.min.css}">
    <link rel="stylesheet" th:href="@{/admin/css/admin.css}">
    <script th:src="@{/admin/webjars/htmx.org/dist/htmx.min.js}" defer></script>
</head>
<body th:hx-headers='|{"${_csrf.headerName}": "${_csrf.token}"}|'>
<header class="admin-bar">
    <nav class="container">
        <ul>
            <li><a th:href="@{/admin}" class="brand"><strong>BSS</strong> <span th:text="#{app.name}">admin</span></a></li>
        </ul>
        <ul>
            <li><a th:href="@{/admin}" th:text="#{nav.dashboard}">Dashboard</a></li>
        </ul>
        <ul>
            <li>
                <a th:href="|?lang=#{language.other.code}|"
                   th:lang="#{language.other.code}"
                   th:text="#{language.other.name}">Magyar</a>
            </li>
            <li sec:authorize="isAuthenticated()" sec:authentication="name">user</li>
            <li sec:authorize="isAuthenticated()">
                <form th:action="@{/admin/logout}" method="post">
                    <button type="submit" class="outline secondary" th:text="#{nav.logout}">Log out</button>
                </form>
            </li>
        </ul>
    </nav>
</header>
<main th:replace="${content}" class="container">Page content</main>
</body>
</html>
