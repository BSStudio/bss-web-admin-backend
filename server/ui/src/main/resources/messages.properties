dashboard.events=Events
dashboard.members=Members
dashboard.lede=Here you look after what the BSS website shows: the videos, the events they belong to, the members who made them, and the labels that sort them.
dashboard.sections=Sections
dashboard.videos.description=Every video on the website: its details, labels and crew, and whether it shows.
dashboard.events.description=Groups of videos, such as a camp or a ball, with their dates.
dashboard.members.description=Studio members past and present, with their role and status.
dashboard.labels=Labels
dashboard.labels.description=Topics that sort the videos on the website.
dashboard.guide.title=How the admin works
dashboard.guide.lists.title=Finding things
dashboard.guide.lists.text=Every list has a search box. Columns with an arrow sort the list; click again to reverse it. At the bottom, choose how many rows a page shows.
dashboard.guide.bulk.title=Changing many at once
dashboard.guide.bulk.text=Tick the rows you want, and a bar with actions takes the search's place: publish or hide videos, or archive, restore or set the status of members.
dashboard.guide.switches.title=Switches save at once
dashboard.guide.switches.text=Visible and Archived in the lists take effect as soon as you flip them, and a message at the top right says what changed. Everything else waits for Save.
dashboard.guide.website.title=What the website shows
dashboard.guide.website.text=A video appears on the website only while it is visible and none of its events is hidden. Hiding an event hides its videos too.
dashboard.guide.editing.title=Editing and deleting
dashboard.guide.editing.text=Open anything by its name. Leaving a form with unsaved changes asks first. Delete always asks, and something still in use can’t be deleted: remove its crew, labels or videos first, or archive a member instead.
dashboard.guide.crew.title=Crew and positions
dashboard.guide.crew.text=On a video’s page, add who worked on it and in what position. Choose New position… to type one that isn’t in the list yet.
dashboard.guide.account.title=Language and errors
dashboard.guide.account.text=Switch between English and Hungarian in your menu at the top right. If something goes wrong, the error page can report it on GitHub with the details filled in.
