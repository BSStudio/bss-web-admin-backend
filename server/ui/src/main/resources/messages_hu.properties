dashboard.members=Tagok
dashboard.lede=Itt gondozod, mit mutat a BSS weboldala: a videókat, az eseményeket, amelyekhez tartoznak, a tagokat, akik készítették őket, és a címkéket, amelyek szerint rendeződnek.
dashboard.sections=Részek
dashboard.videos.description=A weboldal összes videója: az adataik, címkéik és stábjuk, és hogy láthatók-e.
dashboard.events.description=Videók csoportjai, például egy tábor vagy egy bál, a dátumaikkal.
dashboard.members.description=A stúdió régi és mostani tagjai, a szerepükkel és a státuszukkal.
dashboard.labels=Címkék
dashboard.labels.description=Témák, amelyek szerint a weboldal a videókat rendezi.
dashboard.guide.title=Hogyan működik az admin
dashboard.guide.lists.title=Keresés és rendezés
dashboard.guide.lists.text=Minden listában van keresőmező. A nyíllal jelölt oszlopok szerint rendezhetsz; újabb kattintással megfordul a sorrend. Lent választhatod ki, hány sor legyen egy oldalon.
dashboard.guide.bulk.title=Több elem egyszerre
dashboard.guide.bulk.text=Jelöld ki a kívánt sorokat, és a kereső helyén megjelennek a műveletek: videók közzététele vagy elrejtése, tagok archiválása, visszaállítása vagy a státuszuk beállítása.
dashboard.guide.switches.title=A kapcsolók azonnal mentenek
dashboard.guide.switches.text=A listák Látható és Archivált kapcsolói azonnal érvényesek, és jobb felül egy üzenet jelzi, mi változott. Minden más a Mentés gombra vár.
dashboard.guide.website.title=Mi jelenik meg a weboldalon
dashboard.guide.website.text=Egy videó csak akkor látszik a weboldalon, ha látható, és egyik eseménye sem rejtett. Egy esemény elrejtése a videóit is elrejti.
dashboard.guide.editing.title=Szerkesztés és törlés
dashboard.guide.editing.text=Bármit a nevére kattintva nyithatsz meg. Ha mentetlen változtatással hagynál el egy űrlapot, előbb rákérdez. A törlés mindig megerősítést kér, és amit még használnak, nem törölhető: előbb távolítsd el a stábot, a címkéket vagy a videókat, tagot pedig inkább archiválj.
dashboard.guide.crew.title=Stáb és pozíciók
dashboard.guide.crew.text=Egy videó oldalán add hozzá, ki milyen pozícióban dolgozott rajta. Az Új pozíció… választásával olyat is beírhatsz, ami még nincs a listában.
dashboard.guide.account.title=Nyelv és hibák
dashboard.guide.account.text=A jobb felső menüdben válthatsz angol és magyar között. Ha valami elromlik, a hibaoldalról kitöltött adatokkal jelentheted a GitHubon.
error.title.403=Ehhez nincs jogosultságod
error.title.404=Nem találjuk ezt az oldalt
error.title.other=Valami hiba történt
error.lead.403=Lehet, hogy lejárt a munkameneted, vagy ehhez nincs hozzáférésed. Töltsd újra az oldalt, és próbáld újra.
error.lead.404=Lehet, hogy az oldalt vagy a rajta lévő elemet törölték, vagy hibás a cím.
error.lead.other=Az admin nem tudta befejezni a kérést. Próbáld újra, és ha megint előfordul, jelentsd be.
error.report=Bejelentés a GitHubon
error.report.help=A bejelentés a GitHubon nyílik meg, kitöltve a kéréssel, az idővel és az azonosítóval. Írd le, mit csináltál, majd küldd el. Az üzenet és a hívási verem itt marad, az azonosító alapján a naplóban megtaláljuk őket.
